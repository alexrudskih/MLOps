---
stages:
  - build
  - test

build-job:
  stage: build
  tags:
    - netology
  script:
    - echo Building
    - mkdir build
    - echo Create_file > build\info.txt
    - type build\info.txt
  artifacts:
    paths:
      - build\info.txt
    expire_in: 1 hour

test-job:
  stage: test
  tags:
    - netology
  script:
    - echo Testing
    - if exist build\info.txt (echo Файл найден && type build\info.txt) else (echo Файл НЕ найден && exit 1)
  dependencies:
    - build-job